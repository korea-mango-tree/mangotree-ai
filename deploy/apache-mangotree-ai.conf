# mangotree-ai 정적 사이트 — 전용 서브도메인 VirtualHost
#
#   https://ai.mangotree.co.kr/  →  /home/mangotree/mangotree-ai (git clone 한 폴더 그대로)
#
# ※ 아래 두 값은 실제 환경에 맞게 바꾼다 (파일 전체 찾아 바꾸기)
#      ai.mangotree.co.kr          → 실제 서브도메인
#      /home/mangotree/mangotree-ai → 실제 clone 경로
#
# 1) 이 파일을 Apache 설정 폴더에 넣는다
#      Debian/Ubuntu : /etc/apache2/sites-available/mangotree-ai.conf  →  a2ensite mangotree-ai
#      CentOS/Rocky  : /etc/httpd/conf.d/mangotree-ai.conf
# 2) 모듈: rewrite, headers, expires, ssl  (Debian: a2enmod rewrite headers expires ssl)
# 3) 먼저 :80 블록만 살려 둔 채 reload → 인증서 발급
#      certbot certonly --webroot -w /var/www/html -d ai.mangotree.co.kr
#    (또는 certbot --apache -d ai.mangotree.co.kr)
# 4) :443 블록까지 넣고  apachectl configtest && systemctl reload apache2 (또는 httpd)

<VirtualHost *:80>
    ServerName ai.mangotree.co.kr

    # certbot 인증 파일은 그대로 내주고, 나머지는 https 로 보낸다
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ai.mangotree.co.kr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ai.mangotree.co.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai.mangotree.co.kr/privkey.pem

    DocumentRoot /home/mangotree/mangotree-ai
    DirectoryIndex index.html

    <Directory /home/mangotree/mangotree-ai>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 공개하면 안 되는 것: git 이력, 내부 문서·리뷰 캡처, Vercel 전용 함수, 배포 파일, 원본 HTML
    RedirectMatch 404 "^/(\.git|\.claude|docs|api|deploy)(/|$)"
    RedirectMatch 404 "^/(\.gitignore|\.nojekyll|deploy\.sh|index\.source\.html|.*\.md)$"

    # 캐시: CSS/JS 는 파일명에 버전이 없어서 매번 재검증(갱신 즉시 반영), 이미지·영상·폰트는 30일
    <FilesMatch "\.(html|css|js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(jpe?g|png|webp|gif|svg|ico|mp4|webm|woff2?)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # 텍스트 압축 (mod_deflate 가 켜져 있을 때만)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/json
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/mangotree-ai-error.log
    CustomLog ${APACHE_LOG_DIR}/mangotree-ai-access.log combined
</VirtualHost>
