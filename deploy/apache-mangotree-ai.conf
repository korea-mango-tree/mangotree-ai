# mangotree-ai 정적 사이트 — mangotreeai.mangotree.co.kr (CentOS/Rocky httpd)
#
#   http://mangotreeai.mangotree.co.kr/  →  /home/mangotreeai/mangotree-ai (git clone 한 폴더 그대로)
#
# 사용자 생성 때 자동으로 만들어진 <VirtualHost *:80> 블록을 이 내용으로 바꾼다.
#   - DocumentRoot 를 /var/www/html(서버 공용 기본 폴더) → clone 폴더로
#   - CBand(트래픽 제한)·로그 줄은 패널이 만든 그대로 유지
#   - clone 경로가 다르면 DocumentRoot 와 <Directory> 두 곳을 바꾼다
#
# 적용: apachectl configtest && systemctl reload httpd
# 확인: curl -I http://mangotreeai.mangotree.co.kr/portfolio.html  → 200
#       curl -I http://mangotreeai.mangotree.co.kr/docs/           → 404

<VirtualHost *:80>
    ServerAdmin webmaster@domain.com
    DocumentRoot /home/mangotreeai/mangotree-ai
    ServerName mangotreeai.mangotree.co.kr
    CustomLog logs/mangotreeai.mangotree.co.kr-access_log common
    CBandLimit 10000M
    CBandPeriod 1D

    DirectoryIndex index.html

    <Directory /home/mangotreeai/mangotree-ai>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 공개하면 안 되는 것: git 이력, 내부 문서·리뷰 캡처, Vercel 전용 함수, 배포 파일, 원본 HTML
    RedirectMatch 404 "^/(\.git|\.claude|docs|api|deploy)(/|$)"
    RedirectMatch 404 "^/(\.gitignore|\.gitattributes|\.nojekyll|\.htaccess|deploy\.sh|index\.source\.html|.*\.md)$"

    # 캐시: CSS/JS 는 파일명에 버전이 없어서 매번 재검증(갱신 즉시 반영), 이미지·영상·폰트는 30일
    <IfModule mod_headers.c>
        <FilesMatch "\.(html|css|js)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "\.(jpe?g|png|webp|gif|svg|ico|mp4|webm|woff2?)$">
            Header set Cache-Control "public, max-age=2592000"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/json
    </IfModule>
</VirtualHost>

# ── 나중에 SSL 붙일 때 ───────────────────────────────────────────
# 1) certbot certonly --webroot -w /home/mangotreeai/mangotree-ai -d mangotreeai.mangotree.co.kr
# 2) 위 <VirtualHost *:80> 블록을 통째로 복사해 <VirtualHost *:443> 으로 만들고 아래 세 줄 추가
#      SSLEngine on
#      SSLCertificateFile    /etc/letsencrypt/live/mangotreeai.mangotree.co.kr/fullchain.pem
#      SSLCertificateKeyFile /etc/letsencrypt/live/mangotreeai.mangotree.co.kr/privkey.pem
# 3) :80 블록은 https 로 보내기만 하도록 (인증서 갱신 경로는 예외)
#      RewriteEngine On
#      RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
#      RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
