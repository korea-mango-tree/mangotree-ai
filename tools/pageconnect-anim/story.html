<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 메인 「공동구매 플랫폼」 카드용 움직이는 썸네일 원본(960x540, 10초 반복). tools/pageconnect-anim/render.js 로 animated WebP 생성 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:540px;overflow:hidden;background:#fff;font-family:Pretendard,sans-serif}
.stage{position:relative;width:960px;height:540px;overflow:hidden;background:#fff}
.scene{position:absolute;inset:0;opacity:0;animation:10s linear infinite}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;animation:10s ease-in-out infinite}
.cam img{display:block}
.hl{position:absolute;border:5px solid #ffcf00;border-radius:16px;box-shadow:0 0 0 9999px rgba(15,15,15,.28);opacity:0;animation:10s ease infinite}
/* 장면 표시 구간: 1(0-25%) 2(25-50%) 3(50-75%) 4(75-100%) */
.s1{animation-name:show1}.s2{animation-name:show2}.s3{animation-name:show3}.s4{animation-name:show4}
@keyframes show1{0%,22%{opacity:1}25%,97%{opacity:0}100%{opacity:1}}
@keyframes show2{0%,22%{opacity:0}25%,47%{opacity:1}50%,100%{opacity:0}}
@keyframes show3{0%,47%{opacity:0}50%,72%{opacity:1}75%,100%{opacity:0}}
@keyframes show4{0%,72%{opacity:0}75%,97%{opacity:1}100%{opacity:0}}
/* 카메라: 각 장면 안에서 천천히 다가감 */
.c1{animation-name:cam1}.c2{animation-name:cam2}.c3{animation-name:cam3}.c4{animation-name:cam4}
@keyframes cam1{0%{transform:translate(0,0) scale(.6)}22%,100%{transform:translate(-200px,-40px) scale(.85)}}
@keyframes cam2{0%,25%{transform:translate(0,0) scale(.6)}47%,100%{transform:translate(-110px,-300px) scale(.9)}}
@keyframes cam3{0%,50%{transform:translate(-60px,-40px) scale(.75)}72%,100%{transform:translate(-120px,-110px) scale(1.05)}}
@keyframes cam4{0%,75%{transform:translate(-193px,-729px) scale(.744)}97%,100%{transform:translate(-280px,-800px) scale(.8)}}
.h1{animation-name:hl1}.h2{animation-name:hl2}.h3{animation-name:hl3}.h4{animation-name:hl4}
@keyframes hl1{0%,6%{opacity:0}10%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes hl2{0%,31%{opacity:0}35%,47%{opacity:1}50%,100%{opacity:0}}
@keyframes hl3{0%,56%{opacity:0}60%,72%{opacity:1}75%,100%{opacity:0}}
@keyframes hl4{0%,81%{opacity:0}85%,97%{opacity:1}100%{opacity:0}}
/* 3단계: 링크가 SNS로 퍼지는 표시(설명용 그래픽) */
.share{position:absolute;right:40px;top:150px;display:flex;flex-direction:column;gap:16px;opacity:0;animation:share 10s ease infinite}
@keyframes share{0%,58%{opacity:0;transform:translateX(24px)}63%,72%{opacity:1;transform:none}75%,100%{opacity:0}}
.share span{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:10px 20px 10px 10px;font-size:20px;font-weight:700;color:#161616;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.share i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-style:normal;font-size:18px;font-weight:800}
.link{position:absolute;left:330px;top:210px;background:#161616;color:#fff;font-size:20px;font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;animation:link 10s ease infinite}
@keyframes link{0%,54%{opacity:0;transform:scale(.8)}58%{opacity:1;transform:scale(1)}66%{opacity:1;transform:translate(260px,-40px) scale(.9)}70%,100%{opacity:0}}
/* 상단 단계 안내 */
.cap{position:absolute;left:24px;top:24px;display:flex;align-items:center;gap:12px;background:#161616;color:#fff;border-radius:999px;padding:12px 24px 12px 12px;font-size:24px;font-weight:700;letter-spacing:-.02em;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.cap b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#FEE500;color:#161616;font-size:20px}
.cap .t{position:relative;height:32px;min-width:430px}
.cap .t span{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;animation:10s linear infinite}
.cap b span{position:absolute;opacity:0;animation:10s linear infinite}
.cap b{position:relative}
.t1,.n1{animation-name:show1!important}.t2,.n2{animation-name:show2!important}.t3,.n3{animation-name:show3!important}.t4,.n4{animation-name:show4!important}
/* 하단 흐름 막대 */
.flow{position:absolute;left:24px;right:24px;bottom:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.flow div{background:rgba(255,255,255,.94);border-radius:12px;padding:12px 8px;text-align:center;font-size:18px;font-weight:700;color:#8a857c;box-shadow:0 4px 16px rgba(0,0,0,.12);animation:10s linear infinite}
.flow .f1{animation-name:on1}.flow .f2{animation-name:on2}.flow .f3{animation-name:on3}.flow .f4{animation-name:on4}
@keyframes on1{0%,24.9%{background:#FEE500;color:#161616}25%,100%{background:rgba(255,255,255,.94);color:#8a857c}}
@keyframes on2{0%,24.9%{background:rgba(255,255,255,.94);color:#8a857c}25%,49.9%{background:#FEE500;color:#161616}50%,100%{background:rgba(255,255,255,.94);color:#8a857c}}
@keyframes on3{0%,49.9%{background:rgba(255,255,255,.94);color:#8a857c}50%,74.9%{background:#FEE500;color:#161616}75%,100%{background:rgba(255,255,255,.94);color:#8a857c}}
@keyframes on4{0%,74.9%{background:rgba(255,255,255,.94);color:#8a857c}75%,100%{background:#FEE500;color:#161616}}
</style></head><body><div class="stage">
 <div class="scene s1"><div class="cam c1"><img src="../../assets/work/pageconnect.jpg" width="1600" height="900"><div class="hl h1" style="left:430px;top:110px;width:740px;height:450px"></div></div></div>
 <div class="scene s2"><div class="cam c2"><img src="../../assets/workflows/pageconnect-link.jpg" width="1600" height="900"><div class="hl h2" style="left:190px;top:462px;width:250px;height:420px"></div></div></div>
 <div class="scene s3"><div class="cam c3"><img src="../../assets/workflows/pageconnect-link.jpg" width="1600" height="900"><div class="hl h3" style="left:190px;top:180px;width:620px;height:76px"></div></div>
   <div class="link">🔗 상품 링크 복사</div>
   <div class="share"><span><i style="background:#03C75A">N</i>블로그</span><span><i style="background:#E1306C">◎</i>인스타그램</span><span><i style="background:#FF0000">▶</i>유튜브</span></div></div>
 <div class="scene s4"><div class="cam c4"><img src="../../assets/workflows/connect-guide5.jpg" width="4000" height="2250"><div class="hl h4" style="left:770px;top:1040px;width:770px;height:600px"></div></div></div>
 <div class="cap"><b><span class="n1">1</span><span class="n2">2</span><span class="n3">3</span><span class="n4">4</span></b><div class="t"><span class="t1">브랜드가 상품 홍보를 신청해요</span><span class="t2">인플루언서가 홍보할 상품을 골라요</span><span class="t3">상품 링크를 SNS 콘텐츠로 알려요</span><span class="t4">구매·클릭 실적과 판매수익을 확인해요</span></div></div>
 <div class="flow"><div class="f1">브랜드 신청</div><div class="f2">상품 선택</div><div class="f3">SNS 홍보</div><div class="f4">실적·수익</div></div>
</div></body></html>
