<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 메인 h-flow 04 「실적 확인」 화면 원본(960x600). 수치는 화면 설명용 예시 데이터. tools/flow-step4/render.js 로 animated WebP 생성 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:600px;overflow:hidden;background:#F5F3EE;font-family:Pretendard,sans-serif;color:#161616;letter-spacing:-.02em}
.app{position:absolute;inset:24px;display:grid;grid-template-rows:auto auto 1fr;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:24px;font-weight:800}
.top h1 small{margin-left:8px;font-size:12px;font-weight:600;color:#8a857c;background:#ECE5D6;border-radius:999px;padding:4px 8px;vertical-align:middle}
.tabs{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px}
.tabs span{font-size:14px;font-weight:600;color:#8a857c;padding:8px 16px;border-radius:999px}
.tabs span.on{background:#161616;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border-radius:16px;padding:16px}
.kpi p{font-size:14px;color:#6b665c;font-weight:600}
.kpi b{display:block;margin-top:8px;font-size:28px;font-weight:800;letter-spacing:-.03em}
.kpi b small{font-size:16px;font-weight:700;margin-left:2px}
.kpi i{display:inline-block;margin-top:8px;font-style:normal;font-size:12px;font-weight:700;color:#1a7f37;background:#e6f4ea;border-radius:999px;padding:4px 8px}
.kpi.main{background:#161616;color:#fff}.kpi.main p{color:#cfc9bd}.kpi.main i{background:#FEE500;color:#161616}
.row{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;min-height:0}
.card{background:#fff;border-radius:16px;padding:16px 24px;display:flex;flex-direction:column;min-height:0}
.card h2{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font-size:12px;font-weight:600;color:#8a857c}
.bars{flex:1;display:flex;align-items:flex-end;gap:12px;margin-top:40px;padding-bottom:24px;position:relative;border-bottom:1px solid #eee}
.bar{flex:1;position:relative;background:#ECE5D6;border-radius:8px 8px 4px 4px;height:0}
.bar.last{background:#FEE500}
.bar em{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-style:normal;font-size:12px;color:#8a857c;white-space:nowrap}
.bar strong{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;opacity:0}
.ch{margin-top:16px;display:grid;gap:12px}
.ch div{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;font-size:14px;font-weight:600}
.ch u{display:block;height:12px;border-radius:999px;background:#ECE5D6;overflow:hidden;text-decoration:none}
.ch u s{display:block;height:100%;width:0;background:#161616;border-radius:999px;text-decoration:none}
.ch div:first-child u s{background:#FEE500}
.ch em{font-style:normal;text-align:right;color:#6b665c}
.note{margin-top:auto;padding-top:12px;font-size:12px;color:#8a857c}
</style></head><body>
<div class="app">
 <div class="top"><h1>판매 실적<small>예시 데이터</small></h1><div class="tabs"><span>오늘</span><span class="on">최근 7주</span><span>월별</span></div></div>
 <div class="kpis">
  <div class="kpi main"><p>이번 주 매출</p><b><span data-n="12840000" data-f="won"></span><small>원</small></b><i>▲ 12.5% 지난주보다</i></div>
  <div class="kpi"><p>주문 수</p><b><span data-n="98"></span><small>건</small></b><i>▲ 9.6%</i></div>
  <div class="kpi"><p>객단가</p><b><span data-n="131000" data-f="won"></span><small>원</small></b><i>▲ 2.4%</i></div>
  <div class="kpi"><p>구매 전환율</p><b><span data-n="3.2" data-f="pct"></span><small>%</small></b><i>▲ 0.3%p</i></div>
 </div>
 <div class="row">
  <div class="card"><h2>주간 매출 추이<span>단위: 만 원</span></h2>
   <div class="bars" id="bars"></div></div>
  <div class="card"><h2>채널별 매출 비중<span>이번 주</span></h2>
   <div class="ch" id="ch"></div>
   <p class="note">주문·클릭 데이터는 매일 자동으로 모입니다.</p></div>
 </div>
</div>
<script>
const W=[[ '6주 전',820],['5주 전',870],['4주 전',910],['3주 전',960],['2주 전',1050],['지난주',1141],['이번 주',1284]];
const C=[['스마트스토어',47],['자사몰',21],['인스타그램',14],['블로그',11],['기타',7]];
const bars=document.getElementById('bars'),ch=document.getElementById('ch');
W.forEach((w,i)=>{const d=document.createElement('div');d.className='bar'+(i===W.length-1?' last':'');d.innerHTML='<strong>'+w[1].toLocaleString()+'</strong><em>'+w[0]+'</em>';bars.appendChild(d)});
C.forEach(c=>{const d=document.createElement('div');d.innerHTML='<span>'+c[0]+'</span><u><s></s></u><em>'+c[1]+'%</em>';ch.appendChild(d)});
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
// t: 0~6000ms. 0~1.2초 숫자·막대 등장, 이후 유지, 5.4초부터 처음 상태로 서서히
window.render=function(t){const out=t>5400?ease((t-5400)/600):0;
 document.querySelectorAll('[data-n]').forEach((el,i)=>{const k=ease((t-i*120)/1100)*(1-out);const n=+el.dataset.n*k;
  el.textContent=el.dataset.f==='pct'?n.toFixed(1):Math.round(n/ (el.dataset.f==='won'?1000:1))*(el.dataset.f==='won'?1000:1)>0?Math.round(n/(el.dataset.f==='won'?1000:1)*(el.dataset.f==='won'?1000:1)).toLocaleString():'0'});
 const max=1284;[...bars.children].forEach((b,i)=>{const k=ease((t-300-i*130)/700)*(1-out);b.style.height=(W[i][1]/max*92*k)+'%';b.querySelector('strong').style.opacity=i===W.length-1?Math.max(0,Math.min(1,(t-1500)/300))*(1-out):0});
 [...ch.querySelectorAll('s')].forEach((s,i)=>{const k=ease((t-900-i*120)/700)*(1-out);s.style.width=(C[i][1]/47*100*k)+'%'});
};
window.render(2500);
</script></body></html>
